name: VITAL iOS Build

on:
  push:
    branches: [main, vital-3.0]
  pull_request:
    branches: [main]

# Keep only the newest build for this branch; each commit otherwise queues a full macOS build.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Generate VITAL app icon
        run: swift Scripts/GenerateAppIcon.swift
      - name: Show Xcode version
        run: xcodebuild -version
      - name: List project schemes
        run: xcodebuild -list -project VITAL.xcodeproj
      - name: Run core unit tests
        run: swift test
      - name: Build iOS Simulator target
        run: |
          xcodebuild \
            -project VITAL.xcodeproj \
            -scheme VITAL \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Archive unsigned iOS device build (validation only)
        run: |
          xcodebuild \
            -project VITAL.xcodeproj \
            -scheme VITAL \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/VITAL-unsigned.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            archive
      - name: Verify archived app icon is bundled
        run: |
          APP="$RUNNER_TEMP/VITAL-unsigned.xcarchive/Products/Applications/VITAL.app"
          test -s "$APP/Assets.car"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconName' "$APP/Info.plist" >/dev/null
      - name: Package unsigned IPA for sideload signing
        run: |
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$RUNNER_TEMP/VITAL-unsigned.xcarchive/Products/Applications/VITAL.app" "$RUNNER_TEMP/ipa/Payload/VITAL.app"
          test -d "$RUNNER_TEMP/ipa/Payload/VITAL.app"
          (cd "$RUNNER_TEMP/ipa" && /usr/bin/zip -qry "$RUNNER_TEMP/VITAL-unsigned.ipa" Payload)
          test -s "$RUNNER_TEMP/VITAL-unsigned.ipa"
      - name: Upload unsigned IPA for sideload signing
        uses: actions/upload-artifact@v4
        with:
          name: VITAL-unsigned-IPA
          path: ${{ runner.temp }}/VITAL-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
      - name: Upload unsigned archive for inspection
        uses: actions/upload-artifact@v4
        with:
          name: VITAL-unsigned-device-archive
          path: ${{ runner.temp }}/VITAL-unsigned.xcarchive
          if-no-files-found: error
          retention-days: 7
