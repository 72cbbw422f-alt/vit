name: VITAL iOS Build

on:
  push:
    branches: [main, vital-3.0]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Show Xcode version
        run: xcodebuild -version
      - name: List project schemes
        run: xcodebuild -list -project VITAL.xcodeproj
      - name: Run core unit tests
        run: swift test
      - name: Build iOS Simulator target
        run: |
          xcodebuild \
            -project VITAL.xcodeproj \
            -scheme VITAL \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Archive unsigned iOS device build (validation only)
        run: |
          xcodebuild \
            -project VITAL.xcodeproj \
            -scheme VITAL \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/VITAL-unsigned.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            archive
      - name: Upload unsigned archive for inspection
        uses: actions/upload-artifact@v4
        with:
          name: VITAL-unsigned-device-archive
          path: ${{ runner.temp }}/VITAL-unsigned.xcarchive
          if-no-files-found: error
          retention-days: 7
