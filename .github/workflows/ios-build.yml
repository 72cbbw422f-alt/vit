name: VITAL iOS Build

on:
  push:
    branches: [main, vital-3.0]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Show Xcode version
        run: xcodebuild -version
      - name: List project schemes
        run: xcodebuild -list -project VITAL.xcodeproj
      - name: Build iOS Simulator target
        run: |
          xcodebuild \
            -project VITAL.xcodeproj \
            -scheme VITAL \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
